spring:
  application:
    name: compta
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres_admin_db
    username: ${COMPTA_ADMIN_DB_USER}
    password: ${COMPTA_ADMIN_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration/admin   # migre uniquement postgres_admin_db (datasource primaire)

compta:
  crypto:
    master-key: ${COMPTA_MASTER_KEY}
  tenant:
    flyway:
      locations: classpath:db/migration/tenant
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    admin-realm: admin              # issuer = {base-url}/realms/admin ; distinct des realms tenant
