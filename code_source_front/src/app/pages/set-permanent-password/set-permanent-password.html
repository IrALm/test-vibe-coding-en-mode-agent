<div class="auth-shell">
  <div class="auth-card">
    <h1 class="page-title">Définir votre mot de passe définitif</h1>
    <p class="page-intro">
      Votre mot de passe actuel est temporaire. Choisissez-en un nouveau pour accéder à l'application.
    </p>

    <form [formGroup]="form" (ngSubmit)="soumettre()" class="formulaire">
      <label>
        Nouveau mot de passe
        <div class="champ-mdp">
          <input [type]="mdpVisible() ? 'text' : 'password'" formControlName="nouveauMotDePasse" />
          <app-password-toggle [(visible)]="mdpVisible" />
        </div>
        <app-password-rules [motDePasse]="nouveauMotDePasseTexte()" />
      </label>

      <label>
        Confirmation
        <div class="champ-mdp">
          <input
            [type]="confirmationVisible() ? 'text' : 'password'"
            formControlName="confirmation"
            [class.champ-valide]="confirmationTexte().length > 0 && correspond()"
            [class.champ-invalide]="confirmationTexte().length > 0 && !correspond()"
          />
          <app-password-toggle [(visible)]="confirmationVisible" />
        </div>
        @if (confirmationTexte().length > 0) {
          @if (correspond()) {
            <span class="message-correspondance message-correspondance--ok">✓ Les mots de passe correspondent</span>
          } @else {
            <span class="message-correspondance message-correspondance--erreur"
              >✕ Les mots de passe ne correspondent pas</span
            >
          }
        }
      </label>

      @if (erreur()) {
        <app-alert type="error">{{ erreur() }}</app-alert>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="enCours() || !peutSoumettre()">
        {{ enCours() ? 'Validation...' : 'Valider' }}
      </button>
    </form>
  </div>
</div>
