<div class="auth-shell">
  <div class="auth-card">
    <a routerLink="/" class="retour">&larr; Accueil</a>

    <h1 class="page-title">Mot de passe oublié</h1>

    @if (envoye()) {
      <app-alert type="success">
        Si un compte existe pour cet email, un lien de réinitialisation a été envoyé.
      </app-alert>
    } @else {
      <form [formGroup]="form" (ngSubmit)="soumettre()" class="formulaire">
        <label>
          Email
          <input type="email" formControlName="email" />
        </label>

        @if (erreur()) {
          <app-alert type="error">{{ erreur() }}</app-alert>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="enCours()">
          {{ enCours() ? 'Envoi...' : 'Envoyer le lien' }}
        </button>
      </form>
    }
  </div>
</div>
