<div class="date-picker-champ">
  <input
    type="text"
    class="date-picker-input"
    [placeholder]="placeholder()"
    [value]="texteAffiche()"
    (input)="onSaisieTexte($any($event.target).value)"
    (focus)="ouvert.set(true)"
    (blur)="onBlurTexte()"
    (keydown.enter)="onEntreeTexte()"
  />
  <button
    type="button"
    class="date-picker-icone"
    tabindex="-1"
    aria-label="Ouvrir le calendrier"
    (click)="togglePanneau()"
  >
    <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="2.5" y="4" width="15" height="13.5" rx="2.2" />
      <line x1="2.5" y1="8" x2="17.5" y2="8" />
      <line x1="6.5" y1="2.2" x2="6.5" y2="5.5" stroke-linecap="round" />
      <line x1="13.5" y1="2.2" x2="13.5" y2="5.5" stroke-linecap="round" />
    </svg>
  </button>
</div>

@if (ouvert()) {
  <div class="date-picker-panneau" (click)="$event.stopPropagation()">
    <div class="date-picker-entete">
      <button type="button" class="date-picker-nav" (click)="precedent()">&lsaquo;</button>
      <button type="button" class="date-picker-titre" (click)="cliquerEntete()">
        @switch (vue()) {
          @case ('jours') {
            {{ nomMois() }} {{ anneeAffichee() }}
          }
          @case ('mois') {
            {{ anneeAffichee() }}
          }
          @case ('annees') {
            {{ decenieDebut() + 1 }} &ndash; {{ decenieDebut() + 10 }}
          }
        }
      </button>
      <button type="button" class="date-picker-nav" (click)="suivant()">&rsaquo;</button>
    </div>

    @switch (vue()) {
      @case ('jours') {
        <div class="date-picker-jours-semaine">
          @for (n of nomsJours; track $index) {
            <span>{{ n }}</span>
          }
        </div>
        <div class="date-picker-grille-jours">
          @for (c of celluleJours(); track c.iso) {
            <button
              type="button"
              class="date-picker-jour"
              [class.date-picker-jour--hors-mois]="c.horsMois"
              [class.date-picker-jour--aujourdhui]="c.estAujourdhui"
              [class.date-picker-jour--selectionne]="c.estSelectionne"
              [disabled]="c.desactive"
              (click)="choisirJour(c)"
            >
              {{ c.jour }}
            </button>
          }
        </div>
        <button type="button" class="date-picker-aujourdhui" (click)="allerAujourdhui()">Aujourd'hui</button>
      }
      @case ('mois') {
        <div class="date-picker-grille-mois">
          @for (m of celluleMois(); track m.mois) {
            <button
              type="button"
              class="date-picker-cellule"
              [class.date-picker-cellule--actif]="m.actif"
              (click)="choisirMois(m.mois)"
            >
              {{ m.nom }}
            </button>
          }
        </div>
      }
      @case ('annees') {
        <div class="date-picker-grille-annees">
          @for (a of celluleAnnees(); track a.annee) {
            <button
              type="button"
              class="date-picker-cellule"
              [class.date-picker-cellule--actif]="a.actif"
              (click)="choisirAnnee(a.annee)"
            >
              {{ a.annee }}
            </button>
          }
        </div>
      }
    }
  </div>
}
